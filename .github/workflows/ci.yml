name: simulation tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and build tools
        run: sudo apt-get update && sudo apt-get install -y verilator g++ make
      - name: Run all testbenches
        run: sh run_all_tests.sh
